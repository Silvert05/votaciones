<button mat-icon-button [matMenuTriggerFor]="userActions">
  <span class="relative">
    <img class="h-10 w-10 rounded-full" src="img/avatar.png" />
  </span>
</button>

<mat-menu [xPosition]="'before'" #userActions="matMenu">
  <button mat-menu-item>
    <span class="relative">
      <img class="h-10 w-10 rounded-full" src="img/avatar.png" />
    </span>
    <span class="flex flex-col leading-none">
      <span>{{ user()?.nombre ?? 'Administrador' }}</span>
      <span class="mt-1.5 text-md font-medium">{{ user()?.email ?? 'admin@demo.com' }}</span>
    </span>
  </button>
  <mat-divider class="my-2" />
  <button mat-menu-item (click)="goToProfile()">
    <mat-icon class='me-2' [svgIcon]="'heroicons_solid:user-circle'" />
    <span>Mi perfil</span>
  </button>

  <mat-divider class="my-2" />
  <button mat-menu-item (click)="signOut()">
    <mat-icon class='me-2' [svgIcon]="'heroicons_solid:arrow-right-on-rectangle'" />
    <span>Cerrar sesión</span>
  </button>
</mat-menu>
